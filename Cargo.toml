# Workspace con el código de ejemplo del curso.
# Cada ejemplo es un crate en src/chapter_NN/<nombre>/ y se incluye en las notas
# con pymdownx.snippets (--8<-- "src/..."), así lo que se lee es lo que se compila.
[workspace]
resolver = "3"
members = ["src/chapter_*/*", "scripts/doc_deps"]
exclude = [
    "src/chapter_01/example_02", # un solo archivo compilado con `rustc`, sin Cargo
    "projects",                  # proyectos de práctica independientes
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
