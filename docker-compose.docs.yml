services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    image: rust-notes-docs
    # Escribe como tu usuario (no root) para que ./site sea tuyo; el Makefile
    # exporta HOST_UID/HOST_GID. Sin make, se usa 1000:1000.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    container_name: rust-notes-docs
    ports:
      - "8000:8000"
    volumes:
      # Live reload: edits to config/content are picked up without rebuilding
      - ./docs:/docs/docs
      - ./mkdocs.yml:/docs/mkdocs.yml
      - ./src:/docs/src            # código incluido con pymdownx.snippets
      - ./.git:/docs/.git:ro       # historial para la fecha de "última actualización"
    command: mkdocs serve --dev-addr=0.0.0.0:8000

  # One-shot service to render the static site into ./site
  build:
    build:
      context: .
      dockerfile: Dockerfile.docs
    image: rust-notes-docs
    # Escribe como tu usuario (no root) para que ./site sea tuyo; el Makefile
    # exporta HOST_UID/HOST_GID. Sin make, se usa 1000:1000.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./docs:/docs/docs
      - ./mkdocs.yml:/docs/mkdocs.yml
      - ./src:/docs/src            # código incluido con pymdownx.snippets
      - ./.git:/docs/.git:ro       # historial para la fecha de "última actualización"
      - ./site:/docs/site
    command: mkdocs build --strict --site-dir /docs/site
    profiles:
      - build
