[project]
name = "Rust-Notes"
version = "0.0.1"
description = "Notas del curso de Rust (6 meses). El único código Python son los scripts de verificación."
license = { text = "All Rights Reserved" }
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Jose Alonzo", email = "pepemxl@gmail.com"}
]

[tool.uv]
dev-dependencies = [
  "ruff",
  "mypy",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = [
  "scripts/",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E", # pycodestyle
  "F", # pyflakes
  "I", # isort
  "UP", # pyupgrade
  "A", # flake8-builtins
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "COM", # flake8-commas
  "EM", # flake8-errmsg
  "Q", # flake8-quotes
  "PTH", # flake8-use-pathlib
  "SIM", # flake8-simplify
  "TRY", # Trycertatops
  "PERF", # Perflint
  "RUF", # Ruff-specific rules
  "D", # pydocstyle
]
ignore = [
  "COM812", # missing trailing comma, ruff format conflict
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"*.py" = [
  "T201"  # print() statements are used for doctest and normal outputs
]
