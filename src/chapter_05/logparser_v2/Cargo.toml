[package]
name = "logparser_v2"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
nom        = "8"
ahash      = "0.8"
lasso      = "0.7"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile  = "3"

[[bench]]
name    = "optimizaciones"
harness = false

# En un crate independiente iría aquí; en un workspace, Cargo solo lee [profile]
# del Cargo.toml raíz:
# [profile.release]
# debug = 1   # símbolos para flamegraph, sin cambiar el código generado
