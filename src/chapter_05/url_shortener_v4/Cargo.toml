[package]
name = "url_shortener_v4"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
axum        = "0.8"
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
async-trait = "0.1"
dashmap     = "6"
thiserror   = "2"
figment     = { version = "0.10", features = ["toml", "env"] }
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Para llamar al Router en los tests sin abrir un puerto: `router.oneshot(request)`
tower          = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
