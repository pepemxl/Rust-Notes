<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Video Frame Analysis</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>Video Player</h1>
            <div class="controls">
                <select name="1" id="videoSelector">
                    <option value="video1.mp4">Video 1</option>
                    <option value="video2.mp4">Video 2</option>
                    <option value="video3.mp4">Video 3</option>
                </select>
                <button id="prevFrame">Prev Frame</button>
                <button id="play">Play</button>
                <button id="nextFrame">Next Frame</button>
                <button id="play2x">Play 2x</button>
                <button id="play5x">Play 5x</button>
            </div>
            <!--<video id="video" width="720" height="1280" controls>-->
            <video id="video" width="360" height="640" controls></video>
                <source src="/static/video.mp4" type="video/mp4">
                Your Browser does not support video tag
            </video>
        </div>
        <script src="script.js"></script>
    </body>
</html>
