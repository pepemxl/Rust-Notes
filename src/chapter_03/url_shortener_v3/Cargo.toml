[package]
name = "url_shortener_v3"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
# Los módulos de negocio (almacén, handlers, modelos) son los de la Semana 11.
url_shortener_v2 = { path = "../url_shortener_v2" }
axum        = "0.8"
tokio       = { version = "1", features = ["full"] }
serde_json  = "1"
tower-http  = { version = "0.6", features = ["trace", "cors"] }
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "json"] }
metrics                     = "0.24"
metrics-exporter-prometheus = "0.16"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
