name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Workspace de ejemplos (src/): se prueba con la versión mínima que prometen
  # las notas (1.85, primera con la edición 2024) y con la estable actual.
  rust:
    name: Ejemplos (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    env:
      # Las macros query! usan el caché .sqlx/ versionado; no hace falta BD para compilar.
      # Los tests de integración levantan su propio PostgreSQL con testcontainers (Docker).
      SQLX_OFFLINE: "true"
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Mandelbrot del Mes 4 compilado a WebAssembly: clippy para wasm32 y los tests
  # #[wasm_bindgen_test] ejecutados en Node (los que no necesitan el DOM).
  wasm:
    name: WebAssembly (Mes 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: cargo clippy -p mandelbrot-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: wasm-pack test --node
        working-directory: src/chapter_04/mandelbrot_wasm

  # Cada ```rust de docs/ se compila con rustc; falla solo con errores NUEVOS
  # (los conocidos están en scripts/doc_blocks_baseline.json).
  doc-blocks:
    name: Bloques de código (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85", stable]
    # PostgreSQL para validar el SQL de los ejemplos con sqlx::query! (Mes 3).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2   # scripts/doc_deps compila tokio, axum, sqlx...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar las migraciones del Mes 3
        run: |
          for f in src/chapter_03/url_shortener_v2/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: python3 scripts/check_doc_blocks.py --verbose

  python:
    name: Scripts de Python (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check scripts/
      - run: mypy

  docs:
    name: Sitio MkDocs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo para las fechas de actualización
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

  spelling:
    name: Ortografía
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes -p cspell@8 -p @cspell/dict-es-es cspell --no-progress
